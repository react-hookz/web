name: 'CI'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Superseded PR runs are pointless; master runs must finish, since Release
# triggers on their completion.
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # setup-vp replaces corepack + setup-node + dependency cache: it installs
      # vp (version resolved from the vite-plus range via yarn.lock), sets up
      # Node and the pinned yarn, and caches the yarn store.
      - name: 'Setup Vite+'
        uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: 'Install dependencies'
        run: vp install --frozen-lockfile

      - name: 'Format check'
        run: vp fmt --check

      - name: 'Lint'
        run: vp lint

  build:
    name: 'Build'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Setup Vite+'
        uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: 'Install dependencies'
        run: vp install --frozen-lockfile

      - name: 'Build'
        run: vp run build

  test:
    name: 'Test (Node ${{ matrix.node-version }})'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['lts']
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 'Setup Vite+'
        uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          run-install: false

      - name: 'Install dependencies'
        run: vp install --frozen-lockfile

      - name: 'Test'
        run:
          vp test --run --coverage --reporter='github-actions' --reporter='junit'
          --outputFile='./coverage/test-report.junit.xml' --reporter=default

      - name: 'Upload coverage to Codecov'
        if: ${{ matrix.node-version == 'lts' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/clover.xml
          disable_search: true
          fail_ci_if_error: true

      - name: 'Upload test results to Codecov'
        if: ${{ !cancelled() && matrix.node-version == 'lts' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: 'test_results'
          files: coverage/test-report.junit.xml
          fail_ci_if_error: true

  dependabot-merge:
    name: 'Dependabot automerge'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    needs: ['test', 'build', 'lint']
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
